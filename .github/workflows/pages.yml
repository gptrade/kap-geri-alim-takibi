name: Deploy Pages

# Tetik: kod/site değişikliği (push) ve takipçinin yeni veri commit'lediği turlar (daily.yml workflow_dispatch ile çağırır).
# Eskiden her saat workflow_run ile, veri değişmese bile yayın yapılıyordu (günde 24 yayın); GitHub Pages bu sık
# yayınların yaklaşık yarısını "Deployment failed, try again later" ile reddediyordu.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Her yayın sitenin son hâlini taşır: yenisi gelince bekleyen/takılan eskisi iptal edilir.
# (7 Ekim'de github-pages ortamında "waiting" kalan bir yayın sonraki tüm yayınları bir hafta durdurdu.)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub Pages ara sıra geçici hata veriyor ("Deployment failed, try again later"): bir kez daha dene.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
