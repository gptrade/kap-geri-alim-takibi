name: Deploy Pages

on:
     push:
       branches: [main]
     workflow_run:
       workflows: ["kap-buyback-tracker"]
       types: [completed]
     workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Her yayın sitenin son hâlini taşır: yenisi gelince bekleyen/takılan eskisi iptal edilir.
# (7 Ekim'de github-pages ortamında "waiting" kalan bir yayın sonraki tüm yayınları bir hafta durdurdu.)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
